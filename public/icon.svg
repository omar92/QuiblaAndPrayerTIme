<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#043327" />
      <stop offset="100%" stop-color="#021c15" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring with Compass ticks -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.6" />

  <!-- Cardinal indicators -->
  <text x="256" y="86" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold">N</text>
  <text x="430" y="263" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">E</text>
  <text x="256" y="442" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">S</text>
  <text x="82" y="263" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">W</text>

  <!-- Central Kaaba & Compass Needle Motif -->
  <g filter="url(#shadow)">
    <!-- Dial plate -->
    <circle cx="256" cy="256" r="140" fill="#032017" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Compass Needle pointing towards Qibla (Top-North-East angle) -->
    <!-- Emerald & Gold Kaaba in center -->
    <g transform="translate(256, 256)">
      <!-- Golden Crescent & Star at top -->
      <path d="M 0 -115 C 10 -115 18 -108 20 -98 C 12 -98 5 -103 0 -107 C -5 -103 -12 -98 -20 -98 C -18 -108 -10 -115 0 -115 Z" fill="url(#goldGrad)" />
      
      <!-- Compass Needle (North / Qibla arrow) -->
      <polygon points="0,-125 18,-35 0,-15" fill="#ef4444" />
      <polygon points="0,-125 -18,-35 0,-15" fill="#dc2626" />
      <polygon points="0,125 18,35 0,15" fill="#64748b" />
      <polygon points="0,125 -18,35 0,15" fill="#475569" />

      <!-- Kaaba Isometric Cube in center -->
      <g transform="translate(0, 0)">
        <!-- Base Shadow -->
        <ellipse cx="0" cy="18" rx="42" ry="14" fill="#000" opacity="0.4" />
        
        <!-- Kaaba Cube -->
        <!-- Top Face -->
        <polygon points="0,-22 36,-4 0,14 -36,-4" fill="#2d3748" stroke="#f59e0b" stroke-width="1" />
        <!-- Right Face -->
        <polygon points="0,14 36,-4 36,36 0,54" fill="#111827" />
        <!-- Left Face -->
        <polygon points="0,14 -36,-4 -36,36 0,54" fill="#1f2937" />

        <!-- Golden Kiswah Band -->
        <polygon points="0,22 36,4 36,12 0,30" fill="url(#goldGrad)" />
        <polygon points="0,22 -36,4 -36,12 0,30" fill="url(#goldGrad)" />
        
        <!-- Golden Door on Left face -->
        <polygon points="-22,12 -12,17 -12,38 -22,33" fill="url(#goldGrad)" />
      </g>
    </g>
  </g>
</svg>
